name: Build & Release FileMap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            artifact_name: windows-installer
          - os: macos-latest
            platform_flag: --mac
            artifact_name: macos-installer
          - os: ubuntu-latest
            platform_flag: --linux
            artifact_name: linux-appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (with retry)
        shell: bash
        run: |
          for i in 1 2 3; do
            bun install && break
            echo "bun install failed (attempt $i), retrying in 5s..."
            sleep 5
          done

      - name: Typecheck and build Vite + Electron
        shell: bash
        run: |
          bun run tsc --noEmit
          bun run vite build

      - name: Package with electron-builder (with retry)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.platform_flag }} --publish never && break
            echo "electron-builder failed (attempt $i), retrying in 5s..."
            sleep 5
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.blockmap
            release/**/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        run: |
          mkdir -p dist-release
          find artifacts -type f -exec mv -t dist-release {} +
          ls -la dist-release

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FileMap ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
